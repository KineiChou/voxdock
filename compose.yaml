services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    user: "${VOXDOCK_UID:-1000}:${VOXDOCK_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:8787:8787"]
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:-}"
      TELEGRAM_TARGET_ID: "${TELEGRAM_TARGET_ID:-}"
      WHATSAPP_TARGET_PHONE: "${WHATSAPP_TARGET_PHONE:-}"
    volumes:
      - type: bind
        source: ./local
        target: /config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./local/data
        target: /data
        bind:
          create_host_path: false
    tmpfs: [/tmp]
    stop_grace_period: 30s

  wacalls:
    profiles: [whatsapp]
    build:
      context: .
      dockerfile: Dockerfile.wacalls
    init: true
    user: "${VOXDOCK_UID:-1000}:${VOXDOCK_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      WACALLS_MEDIA_SECRET_FILE: /run/secrets/wacalls-media
    secrets:
      - wacalls-media
    volumes:
      - type: bind
        source: ./local/wacalls-data
        target: /data
        bind:
          create_host_path: false
    tmpfs: [/tmp]
    stop_grace_period: 30s

secrets:
  wacalls-media:
    file: ./local/secrets/wacalls-media
