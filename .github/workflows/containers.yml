name: Container checks
on:
  pull_request:
    paths:
      - 'Dockerfile*'
      - '.dockerignore'
      - 'compose.yaml'
      - 'config/**'
      - 'apps/**'
      - 'packages/**'
      - 'patches/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/containers.yml'
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build local source images
        run: |
          docker build -t voxdock:test .
          docker build -f Dockerfile.wacalls -t voxdock-wacalls:test .
      - name: Check CLI, native binding and streaming FFmpeg inside the image
        run: |
          docker run --rm --network none --entrypoint node voxdock:test --import tsx scripts/smoke-control.mts
          docker run --rm --network none --entrypoint node voxdock:test --import tsx packages/telegram/scripts/native-media-smoke.mts
          docker run --rm --network none --entrypoint node voxdock:test --import tsx packages/audio/scripts/streaming-smoke.ts
      - name: Start the private WaCalls image without accounts
        run: |
          docker run -d --name wacalls-smoke --network none --tmpfs /data:uid=1000,gid=1000,mode=0700 voxdock-wacalls:test
          docker run --rm --network container:wacalls-smoke --entrypoint node voxdock:test --input-type=module -e 'const wait=ms=>new Promise(r=>setTimeout(r,ms)); for(let i=0;i<20;i++){try{const r=await fetch("http://127.0.0.1:8080/api/sessions");const b=await r.json();if(r.ok&&Array.isArray(b.sessions)&&b.sessions.length===0)process.exit(0)}catch{} await wait(250)}process.exit(1)'
      - name: Check Compose configuration
        run: docker compose --profile whatsapp config --quiet
      - name: Stop test containers
        if: always()
        run: docker rm -f wacalls-smoke || true
