<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1340" viewBox="0 0 1440 1340" role="img" aria-labelledby="title desc"><title id="title">VoxDock architecture</title><desc id="desc">Operator console, CLI and API use authenticated control and SQLite admission. A local agent CLI connects to a stdio MCP server, which calls the scoped HTTPS control API. A shared runtime connects Telegram through an isolated teleproto and NTgCalls worker, or WhatsApp through a private WaCalls sidecar. Continuous PCM flows to GPT-Live-1 over a primary WebSocket. Client delegation reaches an external HTTP backend through the runtime, with signed events and durable result callbacks. Alternatively, Responses delegation executes through OpenAI with optional web search; the backend still supplies context and receives events. Raw audio stays in memory.</desc><defs>
<marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#64748b"/></marker>
<marker id="audio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#0d9488"/></marker>
<marker id="business" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" fill="#7c3aed"/></marker>
